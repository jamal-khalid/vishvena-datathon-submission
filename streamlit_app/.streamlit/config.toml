# Vishvena AI — Streamlit configuration
# LIGHT professional theme (matches the Missions page design)

[theme]
base = "light"
primaryColor = "#0F6E56"
backgroundColor = "#f2f4f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#1f2533"
font = "sans serif"

[server]
port = 8501
maxUploadSize = 2000
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false